name: Deploy to Pages repo

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pomo repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Checkout pages repo
        uses: actions/checkout@v4
        with:
          repository: jragascoigne/jragascoigne.github.io
          token: ${{ secrets.TARGET_REPO_TOKEN }}
          path: pages-repo

      - name: Copy build into subfolder
        run: |
          rm -rf pages-repo/pomo
          mkdir -p pages-repo/pomo
          cp -r dist/* pages-repo/pomo/

      - name: Commit and push to pages repo
        working-directory: pages-repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git diff --staged --quiet || git commit -m "chore: Update pomo from latest build"
          git push
