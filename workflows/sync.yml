name: Deploy to Pages repo

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pomo repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Checkout pages repo
        uses: actions/checkout@v4
        with:
          repository: jragascoigne/jragascoigne.github.io
          token: ${{ secrets.TARGET_REPO_TOKEN }}
          path: pages-repo

      - name: Copy build into subfolder
        run: |
          rm -rf pages-repo/pomo
          mkdir -p pages-repo/pomo
          cp -r dist/* pages-repo/pomo/   # change 'dist' if your build folder is different
